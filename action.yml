name: ForkLedger Analyze
description: Analyze fork drift, private patches, and missing upstream fixes
author: ForkLedger
branding:
  icon: git-branch
  color: gray-dark

inputs:
  path:
    description: Repository path to analyze
    required: false
    default: "."
  offline:
    description: Skip GitHub and OSV network queries
    required: false
    default: "false"
  comment:
    description: Update a pull request comment with the summary
    required: false
    default: "true"
  github-token:
    description: Token used to update an existing ForkLedger comment
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.22"

    - name: Build ForkLedger
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "$RUNNER_TEMP/forkledger" ./cmd/forkledger

    - name: Analyze
      id: analyze
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set +e
        FLAGS=(--path "${{ inputs.path }}" --output "$RUNNER_TEMP/forkledger.json")
        if [ "${{ inputs.offline }}" = "true" ]; then
          FLAGS+=(--offline)
        fi
        "$RUNNER_TEMP/forkledger" analyze "${FLAGS[@]}"
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        echo "report=$RUNNER_TEMP/forkledger.json" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Summarize
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request' && inputs.comment == 'true'
      env:
        REPORT_PATH: ${{ runner.temp }}/forkledger.json
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const path = process.env.REPORT_PATH;
          if (!fs.existsSync(path)) {
            core.warning('ForkLedger report was not produced');
            return;
          }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const s = report.summary || {};
          const body = [
            '<!-- forkledger-comment -->',
            '## ForkLedger',
            '',
            s.headline || 'Analysis complete.',
            '',
            `| Field | Value |`,
            `| --- | --- |`,
            `| Upstream | ${s.detected_upstream || 'not settled'} |`,
            `| Baseline | ${s.baseline || 'unknown'} |`,
            `| Local patches | ${s.local_modifications ?? 0} |`,
            `| Equivalents | ${s.likely_equivalents ?? 0} |`,
            `| Conflicts | ${s.potential_conflicts ?? 0} |`,
            `| Missing fixes | ${s.missing_security_fixes ?? 0} |`,
            `| Suggested action | ${s.suggested_action || 'n/a'} |`,
            `| Confidence | ${s.confidence || 'n/a'} |`,
            '',
            'This comment is updated in place. See `.forkledger/analysis.json` in CI artefacts for evidence.'
          ].join('\n');
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body && c.body.includes('<!-- forkledger-comment -->'));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
